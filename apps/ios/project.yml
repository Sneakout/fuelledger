name: FuelNerve
options:
  bundleIdPrefix: tech.mindvector
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Local: debug
  Staging: debug
  Production: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  FuelNerve:
    type: application
    platform: iOS
    sources:
      - path: FuelNerve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.mindvector.fuelnerve
        PRODUCT_NAME: FuelNerve
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FuelNerve/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: FuelNerve/FuelNerve.entitlements
        FUELNERVE_USE_PREVIEW_DATA: "NO"
      configs:
        Local:
          FUELNERVE_API_BASE_URL: "http://127.0.0.1:4000/api"
          FUELNERVE_WEB_BASE_URL: "http://127.0.0.1:5173"
          FUELNERVE_ENVIRONMENT: "local"
          GOOGLE_IOS_CLIENT_ID: "973093800218-n9ajkv65lqu6hd57sff1hiqlldhhn0m3.apps.googleusercontent.com"
          GOOGLE_SERVER_CLIENT_ID: "973093800218-5m2qk76rgnj0ka90iqvu7712kmir6d0j.apps.googleusercontent.com"
        Staging:
          FUELNERVE_API_BASE_URL: "https://staging.fuel.mindvector.tech/api"
          FUELNERVE_WEB_BASE_URL: "https://staging.fuel.mindvector.tech"
          FUELNERVE_ENVIRONMENT: "staging"
          GOOGLE_IOS_CLIENT_ID: "973093800218-n9ajkv65lqu6hd57sff1hiqlldhhn0m3.apps.googleusercontent.com"
          GOOGLE_SERVER_CLIENT_ID: "973093800218-5m2qk76rgnj0ka90iqvu7712kmir6d0j.apps.googleusercontent.com"
        Production:
          FUELNERVE_API_BASE_URL: "https://fuel.mindvector.tech/api"
          FUELNERVE_WEB_BASE_URL: "https://fuel.mindvector.tech"
          FUELNERVE_ENVIRONMENT: "production"
          GOOGLE_IOS_CLIENT_ID: "973093800218-n9ajkv65lqu6hd57sff1hiqlldhhn0m3.apps.googleusercontent.com"
          GOOGLE_SERVER_CLIENT_ID: "973093800218-5m2qk76rgnj0ka90iqvu7712kmir6d0j.apps.googleusercontent.com"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    scheme:
      testTargets:
        - FuelNerveTests
  FuelNerveTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: FuelNerveTests
        excludes:
          - Fixtures
      - path: FuelNerveTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: FuelNerve
